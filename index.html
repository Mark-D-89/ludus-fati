<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=prototype-v1.0/">
    <title>Ludus Fati</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Georgia, "Times New Roman", serif;
        background: #09090a;
        color: #f4ecd7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 20%, rgba(214, 192, 139, 0.14), transparent 34rem),
          #09090a;
      }

      main {
        width: min(38rem, calc(100vw - 2rem));
        border: 1px solid rgba(214, 192, 139, 0.42);
        padding: 2rem;
        background: rgba(12, 13, 16, 0.9);
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.4rem, 9vw, 4.8rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      p {
        line-height: 1.6;
      }

      a {
        color: #f0d99e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ludus Fati</h1>
      <p>Launching Prototype 1.0. If the game does not open automatically, use the link below.</p>
      <p><a href="prototype-v1.0/">Play Ludus Fati Prototype 1.0</a></p>
    </main>
  </body>
</html>
