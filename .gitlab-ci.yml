stages:
  - test
  - deploy

validate-release:
  stage: test
  tags:
    - rc-ai-learning
  script:
    - test -f index.html
    - test -f prototype-v1.0/index.html
    - test -f prototype-v1.0/game.js
    - test -f README.md
    - test -f SPEC.md
    - test -f ARCHITECTURE.md
    - test -f RETROSPECTIVE.md
    - test -f docs/COMPLIANCE.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

pages:
  stage: deploy
  tags:
    - rc-ai-learning
  script:
    - mkdir -p public
    - cp index.html public/index.html
    - cp README.md PROTOTYPES.md RULES_DESIGN.md SPEC.md ARCHITECTURE.md RETROSPECTIVE.md public/
    - cp -R docs public/docs
    - cp -R prototype-v1.0 public/prototype-v1.0
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
